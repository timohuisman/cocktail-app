services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cocktail-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cocktail-app.entrypoints=websecure"
      - "traefik.http.routers.cocktail-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.cocktail-app.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

networks:
  internal:
  traefik:
    external: true
    # Pas 'name' aan naar het netwerk waar je bestaande Traefik-container op draait,
    # bv. `docker network ls` op de NAS om de juiste naam te vinden.
    name: traefik

volumes:
  pgdata:
